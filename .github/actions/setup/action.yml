name: Preparar entorno
description: Instala Python y Node con caché, y las dependencias de backend y/o frontend según se pida.

inputs:
  backend:
    description: "'true' para instalar Python y las dependencias del backend"
    required: false
    default: 'true'
  frontend:
    description: "'true' para instalar Node y las dependencias del frontend"
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Set up Python
      if: ${{ inputs.backend == 'true' }}
      uses: actions/setup-python@v7
      with:
        python-version: '3.13'
        cache: pip
        cache-dependency-path: backend-fastapi/requirements-dev.txt

    - name: Install backend dependencies
      if: ${{ inputs.backend == 'true' }}
      shell: bash
      working-directory: backend-fastapi
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt

    - name: Set up Node
      if: ${{ inputs.frontend == 'true' }}
      uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install frontend dependencies
      if: ${{ inputs.frontend == 'true' }}
      shell: bash
      working-directory: frontend
      run: npm ci
