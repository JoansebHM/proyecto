name: CI/CD Pipeline

on:
  pull_request:
    branches: [develop, main]   # E1: PR hacia develop o main
  push:
    branches: [develop, main]   # E2: merge en develop / E3: merge en main
  workflow_dispatch:            # E4: botón de pánico (rollback manual)
    inputs:
      environment:
        description: Ambiente donde se hace el rollback
        type: choice
        options: [staging, production]
        required: true
      version:
        description: SHA completo del commit al que se vuelve (debe existir en ECR)
        type: string
        required: true

permissions:
  contents: read

# Una ejecución nueva en la misma rama espera a que termine la anterior (no la cancela).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1-2. Checkout + Build
  # ---------------------------------------------------------------------------
  build:
    name: Build
    # Si Validar origen falla, no se ejecuta nada más. Si se omite (PR a develop o push), sigue normal.
    needs: validar-origen
    if: ${{ !cancelled() && github.event_name != 'workflow_dispatch' && (needs.validar-origen.result == 'success' || needs.validar-origen.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Build backend (compilar módulos Python)
        working-directory: backend-fastapi
        run: python -m compileall -q app

      - name: Build frontend (vite build)
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  # 3. Test estáticas
  # ---------------------------------------------------------------------------
  test-static:
    name: Test estáticas
    needs: build
    # Se repite el if: si un job anterior (validar-origen) se omite, el implícito success() omitiría este también.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Black (formato backend)
        working-directory: backend-fastapi
        run: black --check app tests

      - name: Flake8 (linter backend)
        working-directory: backend-fastapi
        run: flake8 app tests

      - name: Pylint (linter backend)
        working-directory: backend-fastapi
        run: pylint app

      - name: ESLint (linter frontend)
        working-directory: frontend
        run: npm run lint

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1 (fijada por SHA)

      - name: Terraform fmt y validate (infraestructura)
        run: |
          terraform fmt -check -recursive infra
          for dir in infra infra/ecr; do
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

  # ---------------------------------------------------------------------------
  # 4. Test unitarias
  # ---------------------------------------------------------------------------
  test-unit:
    name: Test unitarias
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Pytest (backend)
        working-directory: backend-fastapi
        run: pytest --no-cov

      - name: Vitest (frontend)
        working-directory: frontend
        run: npm test

  # ---------------------------------------------------------------------------
  # 5. Test cobertura (umbral 80 %)
  # ---------------------------------------------------------------------------
  test-coverage:
    name: Test cobertura
    needs: test-unit
    if: ${{ !cancelled() && needs.test-unit.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/setup

      - name: Cobertura backend (pytest-cov, mínimo 80 %)
        working-directory: backend-fastapi
        run: pytest --cov-fail-under=80

      - name: Cobertura frontend (vitest, mínimo 80 %)
        working-directory: frontend
        run: npm run test:cov

      - name: Subir reportes de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: |
            backend-fastapi/coverage/
            frontend/coverage/

  # ---------------------------------------------------------------------------
  # 5b. SonarCloud (análisis de calidad con Quality Gate, usa los reportes de cobertura)
  # ---------------------------------------------------------------------------
  sonarcloud:
    name: SonarCloud
    needs: test-coverage
    if: ${{ !cancelled() && needs.test-coverage.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # SonarCloud necesita el historial completo para saber qué es código nuevo

      - name: Descargar reportes de cobertura
        uses: actions/download-artifact@v7
        with:
          name: coverage-reports

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4  # v8.5.0 (fijada por SHA, lo exige SonarCloud)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  # ---------------------------------------------------------------------------
  # 6. Release: construir, escanear (Trivy) y publicar las imágenes en ECR
  #    Solo corre al integrar en develop o main (no en los PR).
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: [test-static, sonarcloud]
    if: ${{ !cancelled() && github.event_name == 'push' && needs.test-static.result == 'success' && needs.sonarcloud.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    outputs:
      backend_image: ${{ steps.imagenes.outputs.backend_image }}
      frontend_image: ${{ steps.imagenes.outputs.frontend_image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login en ECR
        id: ecr
        run: |
          REGISTRY="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$REGISTRY"
          echo "registry=$REGISTRY" >> "$GITHUB_OUTPUT"

      - name: Definir nombres de las imágenes (etiqueta = SHA del commit)
        id: imagenes
        run: |
          echo "backend_image=${{ steps.ecr.outputs.registry }}/proyecto-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend_image=${{ steps.ecr.outputs.registry }}/proyecto-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build imagen del backend
        run: docker build -t "${{ steps.imagenes.outputs.backend_image }}" backend-fastapi

      - name: Build imagen del frontend
        run: docker build -t "${{ steps.imagenes.outputs.frontend_image }}" frontend

      # Trivy falla el pipeline si encuentra vulnerabilidades CRÍTICAS que ya tengan corrección.
      - name: Escaneo Trivy del backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (fijada por SHA)
        with:
          image-ref: ${{ steps.imagenes.outputs.backend_image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Escaneo Trivy del frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0 (fijada por SHA)
        with:
          image-ref: ${{ steps.imagenes.outputs.frontend_image }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

      - name: Publicar imágenes en ECR (SHA y latest)
        run: |
          for componente in backend frontend; do
            imagen="${{ steps.ecr.outputs.registry }}/proyecto-${componente}"
            docker tag "${imagen}:${GITHUB_SHA}" "${imagen}:latest"
            docker push "${imagen}:${GITHUB_SHA}"
            docker push "${imagen}:latest"
          done

  # ---------------------------------------------------------------------------
  # 7. IaC: validar y planear la infraestructura de staging (solo push a develop)
  # ---------------------------------------------------------------------------
  iac-staging:
    name: IaC (staging)
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1 (fijada por SHA)

      - name: Terraform init (estado remoto en S3)
        run: terraform -chdir=infra init -input=false -backend-config=backend.hcl

      - name: Seleccionar el workspace staging (se crea si no existe)
        run: terraform -chdir=infra workspace select -or-create staging

      - name: Terraform plan (imágenes con el SHA del commit)
        run: |
          terraform -chdir=infra plan -input=false \
            -var "environment_name=staging" \
            -var "image_tag=${GITHUB_SHA}" \
            -out=tfplan

      - name: Subir el plan para que Deploy aplique exactamente este plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-staging
          path: infra/tfplan
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 8-9. Deploy Infra + Deploy App en staging
  #      Un solo `terraform apply`: la infraestructura y la versión de la app
  #      (image_tag = SHA) están en el mismo plan.
  # ---------------------------------------------------------------------------
  deploy-staging:
    name: Deploy staging
    needs: iac-staging
    if: ${{ !cancelled() && needs.iac-staging.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    outputs:
      app_url: ${{ steps.salida.outputs.app_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1 (fijada por SHA)
        with:
          terraform_wrapper: false  # para poder leer `terraform output` limpio

      - name: Descargar el plan
        uses: actions/download-artifact@v7
        with:
          name: tfplan-staging
          path: infra

      - name: Terraform init
        run: terraform -chdir=infra init -input=false -backend-config=backend.hcl

      - name: Seleccionar el workspace staging
        run: terraform -chdir=infra workspace select staging

      - name: Deploy Infra + App (terraform apply del plan)
        run: terraform -chdir=infra apply -input=false tfplan

      - name: Leer la URL de staging
        id: salida
        run: echo "app_url=$(terraform -chdir=infra output -raw alb_url)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 10. Tests Pre-Prod: E2E (Playwright) contra la app desplegada en staging
  # ---------------------------------------------------------------------------
  test-preprod:
    name: Tests Pre-Prod
    needs: deploy-staging
    if: ${{ !cancelled() && needs.deploy-staging.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ needs.deploy-staging.outputs.app_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Esperar la versión nueva en /api/health (cada 10 s, máximo 5 min)
        run: scripts/esperar-version.sh "$APP_BASE_URL" "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar Playwright
        run: |
          pip install --only-binary :all: --require-hashes -r e2e/requirements.txt
          playwright install --with-deps chromium

      - name: Pruebas E2E contra staging
        run: pytest e2e --html=reporte-preprod.html --self-contained-html

      - name: Subir el reporte HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-preprod
          path: reporte-preprod.html

  # ---------------------------------------------------------------------------
  # 7. IaC: validar y planear la infraestructura de producción (solo push a main)
  # ---------------------------------------------------------------------------
  iac-production:
    name: IaC (production)
    needs: release
    if: ${{ !cancelled() && needs.release.result == 'success' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1 (fijada por SHA)
        with:
          terraform_wrapper: false  # para poder leer `terraform output` limpio

      - name: Terraform init (estado remoto en S3)
        run: terraform -chdir=infra init -input=false -backend-config=backend.hcl

      - name: Seleccionar el workspace production (se crea si no existe)
        run: terraform -chdir=infra workspace select -or-create production

      - name: Terraform plan (imágenes con el SHA del commit)
        run: |
          terraform -chdir=infra plan -input=false \
            -var "environment_name=production" \
            -var "image_tag=${GITHUB_SHA}" \
            -out=tfplan

      - name: Subir el plan para que Deploy aplique exactamente este plan
        uses: actions/upload-artifact@v7
        with:
          name: tfplan-production
          path: infra/tfplan
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 8-9. Deploy Infra + Deploy App en producción
  #      Usa el environment `production`: si tiene revisores requeridos en GitHub,
  #      el job espera su aprobación antes de aplicar.
  # ---------------------------------------------------------------------------
  deploy-production:
    name: Deploy production
    needs: iac-production
    if: ${{ !cancelled() && needs.iac-production.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
    outputs:
      app_url: ${{ steps.salida.outputs.app_url }}
      version_anterior: ${{ steps.anterior.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1 (fijada por SHA)
        with:
          terraform_wrapper: false  # para poder leer `terraform output` limpio

      - name: Descargar el plan
        uses: actions/download-artifact@v7
        with:
          name: tfplan-production
          path: infra

      - name: Terraform init
        run: terraform -chdir=infra init -input=false -backend-config=backend.hcl

      - name: Seleccionar el workspace production
        run: terraform -chdir=infra workspace select production

      # Se guarda el SHA que corre ANTES de desplegar: es la versión a la que vuelve el rollback.
      - name: Guardar la versión que corre hoy en producción
        id: anterior
        run: |
          version=""
          if url="$(terraform -chdir=infra output -raw alb_url 2>/dev/null)"; then
            version="$(curl -fsS --max-time 10 "${url}/api/health" 2>/dev/null \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("version",""))' 2>/dev/null || true)"
          fi
          echo "Versión anterior en producción: '${version:-ninguna (primer despliegue)}'"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Deploy Infra + App (terraform apply del plan)
        run: terraform -chdir=infra apply -input=false tfplan

      - name: Leer la URL de producción
        id: salida
        run: echo "app_url=$(terraform -chdir=infra output -raw alb_url)" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 11. Tests Post-Prod: smoke tests (solo lectura) contra producción
  # ---------------------------------------------------------------------------
  test-postprod:
    name: Tests Post-Prod
    needs: deploy-production
    if: ${{ !cancelled() && needs.deploy-production.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      APP_BASE_URL: ${{ needs.deploy-production.outputs.app_url }}
      EXPECTED_VERSION: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Esperar la versión nueva en /api/health (cada 10 s, máximo 5 min)
        run: scripts/esperar-version.sh "$APP_BASE_URL" "$GITHUB_SHA"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Instalar dependencias de los smoke tests
        run: |
          pip install --only-binary :all: --require-hashes -r smoke/requirements.txt

      - name: Smoke tests contra producción
        run: pytest smoke --html=reporte-postprod.html --self-contained-html

      - name: Subir el reporte HTML
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-postprod
          path: reporte-postprod.html

  # ---------------------------------------------------------------------------
  # 12. Rollback automático: si fallan los smoke tests, vuelve a la versión anterior
  # ---------------------------------------------------------------------------
  rollback-production:
    name: Rollback automático
    needs: [deploy-production, test-postprod]
    if: ${{ !cancelled() && needs.test-postprod.result == 'failure' }}
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      VERSION_ANTERIOR: ${{ needs.deploy-production.outputs.version_anterior }}
      APP_URL: ${{ needs.deploy-production.outputs.app_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sin versión anterior no hay a qué volver
        if: ${{ env.VERSION_ANTERIOR == '' }}
        run: |
          echo "::warning::Es el primer despliegue de producción: no hay versión anterior, se omite el rollback."

      - name: Set up Terraform
        if: ${{ env.VERSION_ANTERIOR != '' }}
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1 (fijada por SHA)
        with:
          terraform_wrapper: false  # para poder leer `terraform output` limpio

      - name: Terraform init
        if: ${{ env.VERSION_ANTERIOR != '' }}
        run: terraform -chdir=infra init -input=false -backend-config=backend.hcl

      - name: Seleccionar el workspace production
        if: ${{ env.VERSION_ANTERIOR != '' }}
        run: terraform -chdir=infra workspace select production

      - name: Volver a la versión anterior (terraform apply con su SHA)
        if: ${{ env.VERSION_ANTERIOR != '' }}
        run: |
          terraform -chdir=infra apply -input=false -auto-approve \
            -var "environment_name=production" \
            -var "image_tag=${VERSION_ANTERIOR}"

      - name: Esperar la versión anterior en /api/health
        if: ${{ env.VERSION_ANTERIOR != '' }}
        run: scripts/esperar-version.sh "$APP_URL" "$VERSION_ANTERIOR"

  # ---------------------------------------------------------------------------
  # 13. Rollback manual (botón de pánico): Actions > Run workflow
  #     Para `production` usa el environment `production` (con su aprobación, si la tiene).
  # ---------------------------------------------------------------------------
  rollback-manual:
    name: Rollback manual
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      AWS_DEFAULT_REGION: us-east-1
      AMBIENTE: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validar el SHA recibido
        run: |
          if ! [[ "$VERSION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::La versión debe ser un SHA completo de 40 caracteres hexadecimales"
            exit 1
          fi

      - name: Verificar que las imágenes de ese SHA existen en ECR
        run: |
          for componente in backend frontend; do
            aws ecr describe-images --repository-name "proyecto-${componente}" --image-ids "imageTag=${VERSION}" > /dev/null \
              || { echo "::error::No existe proyecto-${componente}:${VERSION} en ECR"; exit 1; }
          done

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1 (fijada por SHA)
        with:
          terraform_wrapper: false  # para poder leer `terraform output` limpio

      - name: Terraform init
        run: terraform -chdir=infra init -input=false -backend-config=backend.hcl

      - name: Seleccionar el workspace del ambiente (debe existir)
        run: terraform -chdir=infra workspace select "$AMBIENTE"

      - name: Desplegar las imágenes de ese SHA
        run: |
          terraform -chdir=infra apply -input=false -auto-approve \
            -var "environment_name=${AMBIENTE}" \
            -var "image_tag=${VERSION}"

      - name: Esperar esa versión en /api/health
        run: scripts/esperar-version.sh "$(terraform -chdir=infra output -raw alb_url)" "$VERSION"

  # ---------------------------------------------------------------------------
  # Validar origen de PR hacia main
  # ---------------------------------------------------------------------------
  validar-origen:
    name: Validar origen
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Solo develop puede integrarse en main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "develop" ]; then
            echo "::error::Un PR hacia main debe salir de develop (este sale de '$HEAD_REF')"
            exit 1
          fi
          echo "Origen válido: develop"
