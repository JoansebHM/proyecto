sonar.projectKey=JoansebHM_proyecto
sonar.organization=joansebhm

# Código fuente analizado (backend y frontend) y pruebas
sonar.sources=backend-fastapi/app,frontend/src
sonar.tests=backend-fastapi/tests,e2e
sonar.exclusions=**/*.test.js,**/*.test.jsx,frontend/src/setupTests.js,**/*.css
sonar.coverage.exclusions=frontend/src/main.jsx,frontend/src/setupTests.js,e2e/**

sonar.python.version=3.13

# Reportes de cobertura generados en el job "Test cobertura"
sonar.python.coverage.reportPaths=backend-fastapi/coverage/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# El pipeline espera el resultado del Quality Gate y falla si no pasa
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Riesgos aceptados en la infraestructura (Terraform), por limitaciones del Learner Lab:
#  - S6258 (access logs del ALB): exige un bucket S3 con una política de entrega de logs; fuera del alcance.
#  - S5332 (tráfico HTTP sin cifrar): HTTPS requiere un dominio propio y un certificado (ACM), que el lab no tiene.
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=terraform:S6258
sonar.issue.ignore.multicriteria.e1.resourceKey=infra/**
sonar.issue.ignore.multicriteria.e2.ruleKey=terraform:S5332
sonar.issue.ignore.multicriteria.e2.resourceKey=infra/**
