sonar.projectKey=JoansebHM_proyecto
sonar.organization=joansebhm

# Código fuente analizado (backend y frontend) y pruebas
sonar.sources=backend-fastapi/app,frontend/src
sonar.tests=backend-fastapi/tests,e2e
sonar.exclusions=**/*.test.js,**/*.test.jsx,frontend/src/setupTests.js,**/*.css
sonar.coverage.exclusions=frontend/src/main.jsx,frontend/src/setupTests.js

sonar.python.version=3.13

# Reportes de cobertura generados en el job "Test cobertura"
sonar.python.coverage.reportPaths=backend-fastapi/coverage/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# El pipeline espera el resultado del Quality Gate y falla si no pasa
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
